server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    org.zalando.logbook.Logbook: TRACE

logbook:
  secure-filter:
    enabled: false
  format:
    style: json
  obfuscate:
    json-body-fields:
      - password
      - access_token
      - refresh_token
      - token
      - apiKey
      - client_secret

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  cache:
    type: redis
    cache-names: tasks
    redis:
      time-to-live: 5m
      cache-null-values: false
  datasource:
    url: jdbc:h2:mem:testtask;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

external:
  api:
    url: https://api.restful-api.dev/objects

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@example.test}
    to: ${APP_MAIL_TO:recipient@example.test}
  security:
    username: ${APP_SECURITY_USERNAME:}
    password: ${APP_SECURITY_PASSWORD:}
