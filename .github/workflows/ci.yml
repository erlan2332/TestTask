name: CI

on:
  push:
    branches: [task-dev, refactor/post-stage8-audit]
  pull_request:
    branches: [task-dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          RUN_REDIS_TESTS: 'true'
        run: |
          for attempt in 1 2 3; do
            set +e
            ./gradlew clean build 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Fq 'Received status code 429' "$RUNNER_TEMP/gradle-build.log"; then
              exit "$result"
            fi
            echo "Maven Central returned HTTP 429; retrying build (attempt $((attempt + 1))/3)"
            sleep $((attempt * 20))
          done
      - name: Verify Redis integration tests ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          for test_class in (
              'com.erlan.testtask.cache.RedisTaskCacheIntegrationTest',
              'com.erlan.testtask.cache.RedisStartupCacheIntegrationTest',
              'com.erlan.testtask.email.RedisEmailIntegrationTest',
          ):
              report = ET.parse(f'build/test-results/test/TEST-{test_class}.xml').getroot()
              tests = int(report.attrib['tests'])
              assert tests > 0, test_class
              assert int(report.attrib['skipped']) == 0, test_class
              assert int(report.attrib['failures']) == 0, test_class
              assert int(report.attrib['errors']) == 0, test_class
              print(f'{test_class}: {tests} passed')
          PY
      - name: Build Docker image
        run: docker build -t testtask:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/task-dev'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment of tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          hook = os.environ.get('RENDER_DEPLOY_HOOK_URL', '')
          if not hook:
              sys.exit('RENDER_DEPLOY_HOOK_URL secret is missing')
          parts = urlsplit(hook)
          query = dict(parse_qsl(parts.query))
          query['ref'] = os.environ['GITHUB_SHA']
          url = urlunsplit(parts._replace(query=urlencode(query)))
          try:
              with urlopen(Request(url, method='POST'), timeout=30) as response:
                  status = response.status
                  result = json.load(response) if status == 200 else {}
          except HTTPError as error:
              sys.exit(f'Render deploy hook returned HTTP {error.code}')
          except URLError as error:
              sys.exit(f'Render deploy hook is unreachable: {error.reason}')
          if status not in (200, 202):
              sys.exit(f'Render deploy hook returned HTTP {status}')
          print(f'Render deploy hook accepted tested commit ({status})')
          if result.get('deploy', {}).get('id'):
              print(f"Deploy ID: {result['deploy']['id']}")
          PY
