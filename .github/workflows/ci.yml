name: CI

on:
  push:
    branches: [task-dev]
  pull_request:
    branches: [task-dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          RUN_REDIS_TESTS: 'true'
        run: ./gradlew clean build
      - name: Verify Redis integration tests ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse('build/test-results/test/TEST-com.erlan.testtask.cache.RedisTaskCacheIntegrationTest.xml').getroot()
          tests = int(report.attrib['tests'])
          assert tests > 0
          assert int(report.attrib['skipped']) == 0
          assert int(report.attrib['failures']) == 0
          assert int(report.attrib['errors']) == 0
          print(f'Redis integration tests passed: {tests}')
          PY
